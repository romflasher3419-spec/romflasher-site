name: Build and publish the site

# Every push to main rebuilds dist/ from content/ and publishes it to GitHub
# Pages. Nothing is ever uploaded by hand - the repo is the single source.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # ---- where the site lives ------------------------------------------------
  # One repository variable drives the whole domain switch. While
  # ROMFLASHER_DOMAIN is unset, every canonical URL / sitemap entry keeps the
  # GitHub Pages address - correct, because that is the address that answers.
  #
  # WHEN romflasher.in RESOLVES TO GITHUB PAGES, set a repository variable
  #   Settings -> Secrets and variables -> Actions -> Variables -> New variable
  #       name:  ROMFLASHER_DOMAIN      value: romflasher.in
  # That one variable writes dist/CNAME and points every canonical URL home.
  # ROMFLASHER_SITE_URL is only needed to state the URLs differently from the
  # domain itself - leave it unset normally.
  #
  # Keep both empty until `python _dnscheck.py romflasher.in` says the DNS is
  # live: writing a CNAME earlier makes Pages redirect the working github.io
  # address to a domain that does not answer yet, and the site goes dark.
  ROMFLASHER_DOMAIN: ${{ vars.ROMFLASHER_DOMAIN }}
  ROMFLASHER_SITE_URL: ${{ vars.ROMFLASHER_SITE_URL }}

  # Optional IDs - everything stays switched off while these are empty, so the
  # site never ships half-configured. Uncomment + fill in when you have them.
  # ROMFLASHER_GA4: ${{ vars.ROMFLASHER_GA4 }}
  # Publisher id. Setting this ships the AdSense verification tag in <head> on
  # every page, so the review crawler can find it. No ad, cookie or request is
  # made before a visitor accepts - see adsense_verify() in build.py.
  ROMFLASHER_ADS: ${{ vars.ROMFLASHER_ADS }}
  # ROMFLASHER_AMAZON: ${{ vars.ROMFLASHER_AMAZON }}
  # ROMFLASHER_GOOGLE: ${{ vars.ROMFLASHER_GOOGLE }}
  # ROMFLASHER_BING: ${{ vars.ROMFLASHER_BING }}

  # Ad units. ROMFLASHER_ADS is the publisher id (pub-...); each slot is the
  # numeric id AdSense prints for that unit. All three stay off while the
  # publisher id is empty, so an approved-but-unfinished account cannot publish
  # units that 404.
  ROMFLASHER_SLOT_ARTICLE: ${{ vars.ROMFLASHER_SLOT_ARTICLE }}
  ROMFLASHER_SLOT_LIST: ${{ vars.ROMFLASHER_SLOT_LIST }}
  ROMFLASHER_SLOT_HUB: ${{ vars.ROMFLASHER_SLOT_HUB }}

jobs:
  build:
    name: Build dist/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the site
        run: python build.py

      - name: Structured data + SEO check
        run: python _seocheck.py

      - name: Internal link check
        run: python qa.py --links

      - name: Note how many articles are still waiting
        run: python set_article.py --missing || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
