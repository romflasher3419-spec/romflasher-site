<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="textGrad" x1="120" y1="20" x2="260" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="shockGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="hoodieGrad" x1="20" y1="36" x2="40" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>

    <style>
      .cartoon-char {
        transform-origin: 32px 58px;
        animation: charMotion 4.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
      }
      @keyframes charMotion {
        0%, 18% { transform: translate(0, 0) rotate(0deg); }
        21% { transform: translate(2px, 0) rotate(3deg); }
        25% { transform: translate(-3px, -2px) rotate(-8deg) scale(1.08); }
        28% { transform: translate(4px, 2px) rotate(9deg) scale(1.12); }
        31% { transform: translate(-4px, 3px) rotate(-9deg) scale(1.08); }
        34% { transform: translate(4px, -3px) rotate(8deg) scale(1.14); }
        37% { transform: translate(-3px, 1px) rotate(-8deg) scale(1.09); }
        40% { transform: translate(3px, -2px) rotate(9deg) scale(1.12); }
        43% { transform: translate(-4px, 2px) rotate(-7deg) scale(1.07); }
        46% { transform: translate(3px, -3px) rotate(7deg) scale(1.1); }
        49% { transform: translate(-2px, 2px) rotate(-4deg) scale(1.04); }
        52% { transform: translate(0, 0) rotate(0deg) scale(1); }
        55% { transform: translate(-14px, 12px) rotate(-75deg); }
        58%, 76% { transform: translate(-16px, 14px) rotate(-85deg); }
        82% { transform: translate(-6px, 6px) rotate(-30deg); }
        88%, 100% { transform: translate(0, 0) rotate(0deg); }
      }

      .hair-normal { animation: hairNorm 4.5s infinite; }
      .hair-shocked { animation: hairShock 4.5s infinite; opacity: 0; }
      @keyframes hairNorm {
        0%, 24% { opacity: 1; }
        25%, 52% { opacity: 0; }
        53%, 100% { opacity: 1; }
      }
      @keyframes hairShock {
        0%, 24% { opacity: 0; transform: scale(1); }
        25%, 52% { opacity: 1; transform: scale(1.25) translateY(-2px); }
        53%, 100% { opacity: 0; }
      }

      .face-normal { animation: faceNorm 4.5s infinite; }
      .face-shocked { animation: faceShock 4.5s infinite; opacity: 0; }
      .face-faint { animation: faceFaint 4.5s infinite; opacity: 0; }

      @keyframes faceNorm {
        0%, 24% { opacity: 1; }
        25%, 78% { opacity: 0; }
        79%, 100% { opacity: 1; }
      }
      @keyframes faceShock {
        0%, 24% { opacity: 0; }
        25%, 52% { opacity: 1; }
        53%, 100% { opacity: 0; }
      }
      @keyframes faceFaint {
        0%, 52% { opacity: 0; }
        53%, 78% { opacity: 1; }
        79%, 100% { opacity: 0; }
      }

      .hand-cable {
        transform-origin: 34px 44px;
        animation: plugAction 4.5s infinite ease-in-out;
      }
      @keyframes plugAction {
        0%, 18% { transform: translate(0, 0); }
        22%, 52% { transform: translate(7px, -2px); }
        54%, 76% { transform: translate(-8px, 12px) rotate(-50deg); }
        84%, 100% { transform: translate(0, 0); }
      }

      .lightning-group {
        opacity: 0;
        transform-origin: 47px 42px;
        animation: zapBurst 4.5s infinite;
      }
      @keyframes zapBurst {
        0%, 24% { opacity: 0; transform: scale(0.3); }
        25% { opacity: 1; transform: scale(1.4) rotate(15deg); }
        29% { opacity: 0.3; transform: scale(0.8) rotate(-15deg); }
        33% { opacity: 1; transform: scale(1.5) rotate(25deg); }
        37% { opacity: 0.4; transform: scale(1) rotate(-10deg); }
        41% { opacity: 1; transform: scale(1.6) rotate(20deg); }
        45% { opacity: 0.2; transform: scale(0.7) rotate(-25deg); }
        49% { opacity: 1; transform: scale(1.3) rotate(5deg); }
        53%, 100% { opacity: 0; transform: scale(0); }
      }

      .dizzy-halo {
        transform-origin: 22px 28px;
        animation: dizzySpin 4.5s infinite linear;
        opacity: 0;
      }
      @keyframes dizzySpin {
        0%, 52% { opacity: 0; transform: rotate(0deg) scale(0); }
        54% { opacity: 1; transform: rotate(60deg) scale(1); }
        75% { opacity: 1; transform: rotate(320deg) scale(1); }
        78%, 100% { opacity: 0; transform: rotate(360deg) scale(0); }
      }

      .wire-lightning {
        stroke-dasharray: 8 16;
        animation: wireCurrent 0.5s linear infinite, wireZap 4.5s infinite;
      }
      @keyframes wireZap {
        0%, 24% { opacity: 0; }
        25%, 52% { opacity: 1; }
        53%, 100% { opacity: 0; }
      }
      @keyframes wireCurrent {
        from { stroke-dashoffset: 48; }
        to { stroke-dashoffset: 0; }
      }
      .brand-title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 800;
        font-size: 26px;
        letter-spacing: -0.5px;
      }
      .brand-sub-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        font-size: 8.5px;
        fill: #94a3b8;
        letter-spacing: 1.5px;
      }
    </style>
  </defs>

  <!-- 1. DYNAMIC JHOOLTI HUI WIRE (REAL SAGGING & WHIPPING PHYSICS) -->
  <path id="wirePath" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" fill="none"
    d="M 234 38 C 215 54, 145 66, 85 64 C 65 62, 52 56, 47 48">
    <animate attributeName="d" dur="4.5s" repeatCount="indefinite"
      values="
        M 234 38 C 215 54, 145 66, 85 64 C 65 62, 52 56, 47 48;
        M 234 38 C 215 56, 145 69, 85 67 C 65 65, 52 58, 47 48;
        M 234 38 C 215 52, 145 63, 85 61 C 65 59, 52 54, 47 48;
        M 234 38 C 210 38, 170 66, 120 38 C 80 66, 55 38, 47 48;
        M 234 38 C 210 66, 170 38, 120 66 C 80 38, 55 66, 47 48;
        M 234 38 C 210 38, 170 66, 120 38 C 80 66, 55 38, 47 48;
        M 234 38 C 215 62, 145 74, 80 72 C 60 70, 42 66, 38 60;
        M 234 38 C 215 58, 145 68, 80 68 C 60 66, 45 60, 38 58;
        M 234 38 C 215 54, 145 66, 85 64 C 65 62, 52 56, 47 48
      "
      keyTimes="0; 0.12; 0.22; 0.28; 0.36; 0.48; 0.58; 0.76; 1"
    />
  </path>

  <path class="wire-lightning" stroke="#facc15" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#shockGlow)"
    d="M 234 38 C 215 54, 145 66, 85 64 C 65 62, 52 56, 47 48">
    <animate attributeName="d" dur="4.5s" repeatCount="indefinite"
      values="
        M 234 38 C 215 54, 145 66, 85 64 C 65 62, 52 56, 47 48;
        M 234 38 C 215 56, 145 69, 85 67 C 65 65, 52 58, 47 48;
        M 234 38 C 215 52, 145 63, 85 61 C 65 59, 52 54, 47 48;
        M 234 38 C 210 38, 170 66, 120 38 C 80 66, 55 38, 47 48;
        M 234 38 C 210 66, 170 38, 120 66 C 80 38, 55 66, 47 48;
        M 234 38 C 210 38, 170 66, 120 38 C 80 66, 55 38, 47 48;
        M 234 38 C 215 62, 145 74, 80 72 C 60 70, 42 66, 38 60;
        M 234 38 C 215 58, 145 68, 80 68 C 60 66, 45 60, 38 58;
        M 234 38 C 215 54, 145 66, 85 64 C 65 62, 52 56, 47 48
      "
      keyTimes="0; 0.12; 0.22; 0.28; 0.36; 0.48; 0.58; 0.76; 1"
    />
  </path>

  <circle cx="234" cy="38" r="2.2" fill="#38bdf8" />

  <!-- 2. REAL CARTOON GUY (HEAD, HAIR, HOODIE, ARMS, LEGS, SHOES) -->
  <g class="cartoon-char">
    <!-- LEGS & SHOES -->
    <line x1="26" y1="50" x2="25" y2="62" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" />
    <ellipse cx="23" cy="63" rx="4.5" ry="2.2" fill="#e2e8f0" stroke="#0f172a" stroke-width="1" />
    <line x1="33" y1="50" x2="35" y2="62" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" />
    <ellipse cx="37" cy="63" rx="4.5" ry="2.2" fill="#e2e8f0" stroke="#0f172a" stroke-width="1" />

    <!-- HOODIE -->
    <path d="M 21 38 C 21 36, 38 36, 38 38 L 36 51 C 36 52, 23 52, 23 51 Z" fill="url(#hoodieGrad)" />
    <path d="M 27 38 L 29 44 L 31 38" stroke="#cbd5e1" stroke-width="1.2" fill="none" />

    <!-- HEAD -->
    <circle cx="29" cy="27" r="10" fill="#fde047" stroke="#ca8a04" stroke-width="1.2" />

    <!-- NORMAL HAIR -->
    <g class="hair-normal">
      <path d="M 19 25 C 19 18, 25 14, 33 16 C 36 15, 39 18, 39 24 C 37 21, 35 21, 33 22 C 31 20, 27 19, 25 22 C 22 21, 20 23, 19 25 Z" fill="#78350f" />
      <path d="M 28 14 L 30 10 L 32 14" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- SHOCKED HAIR -->
    <g class="hair-shocked" filter="url(#shockGlow)">
      <path d="M 16 23 L 13 14 L 20 18 L 22 9 L 27 16 L 31 7 L 34 16 L 39 10 L 39 18 L 44 14 L 41 24 Z" fill="#facc15" stroke="#ea580c" stroke-width="1.5" />
    </g>

    <!-- NORMAL FACE -->
    <g class="face-normal">
      <ellipse cx="26" cy="27" rx="1.6" ry="2.2" fill="#0f172a" />
      <ellipse cx="33" cy="27" rx="1.6" ry="2.2" fill="#0f172a" />
      <circle cx="26.5" cy="26.5" r="0.6" fill="#fff" />
      <circle cx="33.5" cy="26.5" r="0.6" fill="#fff" />
      <path d="M 27 31 Q 29.5 33.5 32 31" stroke="#b45309" stroke-width="1.4" fill="none" stroke-linecap="round" />
      <circle cx="23" cy="29" r="1.5" fill="#f87171" opacity="0.6" />
      <circle cx="36" cy="29" r="1.5" fill="#f87171" opacity="0.6" />
    </g>

    <!-- SHOCKED FACE -->
    <g class="face-shocked">
      <path d="M 23 25 L 27 28 L 24 29 L 28 32" stroke="#ea580c" stroke-width="1.8" fill="none" stroke-linecap="round" />
      <path d="M 31 25 L 35 28 L 32 29 L 36 32" stroke="#ea580c" stroke-width="1.8" fill="none" stroke-linecap="round" />
      <ellipse cx="29.5" cy="32" rx="3.5" ry="4" fill="#7f1d1d" stroke="#ea580c" stroke-width="1" />
    </g>

    <!-- FAINTED FACE -->
    <g class="face-faint">
      <line x1="24" y1="25" x2="28" y2="29" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" />
      <line x1="28" y1="25" x2="24" y2="29" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" />
      <line x1="31" y1="25" x2="35" y2="29" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" />
      <line x1="35" y1="25" x2="31" y2="29" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" />
      <path d="M 28 32 Q 30 31 32 32" stroke="#b45309" stroke-width="1.2" fill="none" />
      <path d="M 29 32 C 29 35, 32 35, 32 32 Z" fill="#f87171" />
    </g>

    <!-- ARMS & HANDS -->
    <g class="arm-left">
      <path d="M 23 40 L 16 43 L 14 39" stroke="#4338ca" stroke-width="3" stroke-linecap="round" />
      <rect x="8" y="32" width="11" height="19" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="1.2" />
      <rect x="9.5" y="34" width="8" height="14" fill="#38bdf8" opacity="0.85" />
      <rect x="12" y="50" width="3.5" height="1.8" fill="#94a3b8" />
      <circle cx="15" cy="40" r="2.2" fill="#fde047" />
    </g>

    <g class="hand-cable">
      <path d="M 35 41 Q 42 45 44 47" stroke="#4338ca" stroke-width="3" stroke-linecap="round" fill="none" />
      <circle cx="43" cy="47" r="2.4" fill="#fde047" />
      <rect x="44.5" y="46" width="5.5" height="3.5" rx="1" fill="#facc15" stroke="#ca8a04" stroke-width="0.8" />
    </g>
  </g>

  <!-- 3. ELECTRIC SHOCK SPARKS -->
  <g class="lightning-group" filter="url(#shockGlow)">
    <path d="M 12 51 L 6 44 L 11 41 L 4 33" stroke="#facc15" stroke-width="2.2" fill="none" />
    <path d="M 16 52 L 23 47 L 18 44 L 25 38" stroke="#38bdf8" stroke-width="2.2" fill="none" />
    <path d="M 14 53 L 11 61 L 16 63 L 10 70" stroke="#facc15" stroke-width="2.2" fill="none" />
    <circle cx="14" cy="51" r="5" fill="#fff" />
    <path d="M 39 20 L 44 24 L 41 28" stroke="#facc15" stroke-width="2" fill="none" />
    <path d="M 17 18 L 22 22 L 19 25" stroke="#38bdf8" stroke-width="2" fill="none" />
  </g>

  <!-- 4. DIZZY ROTATING STARS -->
  <g class="dizzy-halo">
    <path d="M 14 16 L 16 18 L 14 20 L 12 18 Z" fill="#facc15" />
    <path d="M 26 11 L 28 14 L 26 17 L 24 14 Z" fill="#facc15" />
    <path d="M 35 18 L 37 20 L 35 22 L 33 20 Z" fill="#38bdf8" />
  </g>

  <!-- 5. BRAND TYPOGRAPHY: EXACT 'r' AT (234, 38) -->
  <g id="brandTypography">
    <text x="76" y="38" class="brand-title-text" fill="#ffffff">
      Rom<tspan fill="url(#textGrad)">Flasher</tspan>
    </text>
    <text x="77" y="49" class="brand-sub-text">
      ALL-IN-ONE ANDROID TOOL
    </text>
  </g>
</svg>
